name: Itachi Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - README.md
      - assets/**

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and publish crimson snakes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Itachi-themed contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#B91C3C&color_dots=#F1E8EB,#FECACA,#F87171,#DC2626,#7F1D1D
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F87171&color_dots=#16161E,#451521,#7F1D1D,#B91C3C,#EF4444
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated files
        run: |
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg

      - name: Publish animations to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          commit_message: "Refresh Itachi contribution snakes [skip ci]"
